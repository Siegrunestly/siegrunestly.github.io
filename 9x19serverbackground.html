<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Image</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      background: #000; 
      height: 100%;
    }
    img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      display: block; 
    }
  </style>
</head>
<body>
  <img id="randomImg" alt="RandomImage">

  <script>
    const images = [
      "s_21loading.png", "loading2.png", "s5_shishantool.png", 
      "s2_arbuzi.png", "lisiks.png", "zapugali.png", 
      "hubische.png", "s2_angus.png", "petushara.png", 
      "s2_nyrik.png", "natsufag.png", "s2_shishan.png"
    ];
    
    const chosen = images[Math.floor(Math.random() * images.length)];
    document.getElementById("randomImg").src = chosen;
  </script>
</body>
</html>
